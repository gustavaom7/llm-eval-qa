name: CI

on:
  push:
  pull_request:

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint
        run: ruff check .
      # Unit tests and every gate, red-team included, replaying the recorded answers in cassettes/.
      # A gate fails on any failure not listed in datasets/known_findings.yaml.
      - name: Test
        run: pytest -v
      - name: Summary
        if: always()
        run: if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload case report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-cases
          path: reports/cases.json
          if-no-files-found: ignore
      - name: Prepare Pages report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: install -D reports/index.html pages-report/index.html
      # The HTML report goes to GitHub Pages from main only (Settings > Pages > Source: GitHub Actions).
      - name: Upload report for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-report/

  pages:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy report
        id: deploy
        uses: actions/deploy-pages@v4
