name: CI

on:
  push:
  pull_request:

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,eval]"
      - name: Lint
        run: ruff check .
      # Unit tests and every gate, replaying the recorded answers in cassettes/. A gate fails on any
      # failure not listed in datasets/known_findings.yaml. The red-team suite joins once its answers
      # are recorded.
      - name: Test
        run: pytest -v -m "not redteam"
      - name: Summary
        if: always()
        run: if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
