name: CI

on:
  push:
  pull_request:

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # Unit tests and the retrieval gate. The quality suites replay recorded answers and join
      # once the first recording is committed.
      - name: Test
        run: pytest -v -m "not quality"
