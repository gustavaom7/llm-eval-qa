name: CI

on:
  push:
  pull_request:

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,eval]"
      - name: Lint
        run: ruff check .
      # Unit tests and every gate, red-team included, replaying the recorded answers in cassettes/.
      # A gate fails on any failure not listed in datasets/known_findings.yaml.
      - name: Test
        run: pytest -v
      - name: Summary
        if: always()
        run: if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      # The HTML report goes to GitHub Pages from main only (Settings > Pages > Source: GitHub Actions).
      - name: Upload report for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  pages:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy report
        id: deploy
        uses: actions/deploy-pages@v4
