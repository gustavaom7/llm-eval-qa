[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-qa"
version = "0.1.0"
description = "A retrieval-augmented support bot and the evaluation pipeline around it"
requires-python = ">=3.12"
dependencies = ["rank-bm25>=0.2.2", "pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Pinned exactly: the judge's prompts come from DeepEval and are part of the recorded cassette keys.
eval = ["deepeval==4.3.0"]
# Build-time only (scripts/build_redteam.py): deepteam 1.0.9 imports sentry_sdk without declaring it.
redteam = ["deepteam==1.0.9", "sentry-sdk>=2"]

[project.scripts]
support-bot = "support_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_bot = ["prompts/*.md"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DeepEval auto-loads a pytest plugin for its own test runner (and telemetry); this suite does not use it.
addopts = "--strict-markers -p no:deepeval"
markers = [
    "retrieval: retrieval gate, needs no model",
    "quality: gates on recorded bot answers and judge scores",
]
